<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missão Planeta</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --ink: #1d4a35;
      --mut: #4f6f60;
      --line: #c9e7d2;
      --acc: #2a8a46;
      --btn: #2f8f45;
      --btnt: #ffffff;
      --sun: #ffd23f;
      --lime: #9bdc5a;
      --pink: #f59a8c;
      --sea: #5ec3ee;
      --i1: #e3f6e9;
      --i2: #dff5cf;
      --i3: #d6eefb;
      --i4: #fff1b8;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    /* tema claro fixo: fundo branco */
    :root[data-theme="dark"] {
      --bg: #0a1b2e;
      --card: #122a44;
      --ink: #eef6f6;
      --mut: #a9c0d3;
      --line: #25496a;
      --acc: #6fe3d6;
      --btn: #b8e84a;
      --btnt: #0d2b45;
      --i1: #4a2a3a;
      --i2: #2c4a24;
      --i3: #1d3f66;
      --i4: #4d4220;
      color-scheme: dark
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 18px/1.55 "Atkinson Hyperlegible", system-ui, sans-serif
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--card);
      z-index: 10
    }

    h1,
    h2,
    h3 {
      font-family: Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif;
      font-weight: 700;
      line-height: 1.1;
      margin: 0 0 12px
    }

    h1 {
      font-size: clamp(2.1rem, 8vw, 3.2rem)
    }

    h2 {
      font-size: 1.8rem
    }

    h3 {
      font-size: 1.25rem
    }

    p {
      margin: 0 0 12px
    }

    a {
      color: inherit
    }

    :focus-visible {
      outline: 4px solid var(--sun);
      outline-offset: 3px
    }

    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9;
      background: var(--card);
      border-bottom: 2px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px
    }

    .logo {
      font: 700 1.3rem Fredoka, system-ui, sans-serif;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .ages {
      display: flex;
      gap: 6px
    }

    .ages button {
      font: inherit;
      font-weight: 700;
      font-size: .95rem;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer
    }

    .ages button[aria-pressed="true"] {
      background: var(--btn);
      color: var(--btnt);
      border-color: var(--btn)
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 56px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      border: 0;
      background: var(--btn);
      color: var(--btnt);
      font: 700 1.05rem Fredoka, system-ui, sans-serif;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .25)
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .25)
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: none
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px
    }

    .card {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 28px;
      padding: 22px;
      margin-bottom: 18px
    }

    .hero {
      background: radial-gradient(circle at 90% 10%, #ffe27a 0 54px, transparent 56px), linear-gradient(160deg, #d7f2bf 0%, #bfe7f7 100%);
      color: #1d4a35;
      border-radius: 44px 44px 44px 12px;
      padding: 28px 22px 24px;
      position: relative;
      overflow: hidden;
      margin-bottom: 22px
    }

    .hero p {
      max-width: 30ch;
      font-size: 1.1rem
    }

    .hero .btn {
      background: #2f8f45;
      color: #fff
    }

    .hero .btn.ghost {
      background: transparent;
      color: #1d4a35;
      border-color: #1d4a35
    }

    .globe {
      position: absolute;
      right: -30px;
      bottom: -34px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #bfe9ff, #6fcf8f 55%, #3a9fd0);
      display: grid;
      place-items: center;
      font-size: 4.6rem;
      opacity: .95
    }

    .tuti {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 18px
    }

    .face {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: 50% 50% 46% 54%;
      background: var(--lime);
      display: grid;
      place-items: center;
      font-size: 2.2rem
    }

    .tuti p {
      margin: 0;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 6px 24px 24px 24px;
      padding: 12px 16px
    }

    .bar {
      height: 16px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
      margin-top: 10px
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--sea), var(--lime));
      border-radius: 99px;
      transition: width .4s
    }

    .map {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 10px 0
    }

    .map::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 20px;
      bottom: 20px;
      border-left: 5px dotted var(--sea);
      transform: translateX(-50%);
      opacity: .6
    }

    .stop {
      position: relative;
      width: 80%;
      padding: 20px 22px;
      text-decoration: none;
      color: var(--ink);
      border: 3px solid var(--ink);
      display: block
    }

    .stop b {
      display: block;
      font: 700 1.3rem Fredoka, system-ui, sans-serif;
      line-height: 1.15
    }

    .stop span.s {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 99px;
      background: var(--card);
      font-weight: 700;
      font-size: .95rem
    }

    .stop .ic {
      font-size: 2.3rem;
      display: block;
      margin-bottom: 4px
    }

    .stop.l {
      align-self: flex-start
    }

    .stop.r {
      align-self: flex-end
    }

    .k0 {
      background: var(--i1);
      border-radius: 60% 40% 55% 45%/50% 55% 45% 50%
    }

    .k1 {
      background: var(--i2);
      border-radius: 45% 55% 40% 60%/55% 45% 55% 45%
    }

    .k2 {
      background: var(--i3);
      border-radius: 55% 45% 60% 40%/45% 55% 45% 55%
    }

    .k3 {
      background: var(--i4);
      border-radius: 40% 60% 45% 55%/60% 40% 55% 45%
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-weight: 700;
      margin-bottom: 10px
    }

    .big-ico {
      font-size: 3rem
    }

    .pts {
      padding-left: 1.2em;
      margin: 0
    }

    .pts li {
      margin-bottom: 12px
    }

    .lesson {
      font-size: 1.25rem
    }

    .dots {
      display: flex;
      gap: 8px;
      margin-bottom: 16px
    }

    .dots i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--line)
    }

    .dots i.on {
      background: var(--sea)
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 3px solid var(--line);
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 10px;
      min-height: 56px;
      cursor: pointer
    }

    .opt.ok {
      background: var(--i2);
      border-color: #4caf50
    }

    .opt.no {
      background: var(--i1);
      border-color: var(--pink)
    }

    .fb {
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--i4);
      margin: 12px 0
    }

    .chal {
      display: flex;
      gap: 14px;
      align-items: flex-start
    }

    .chal .ci {
      font-size: 2.2rem
    }

    .chal.done {
      background: var(--i2)
    }

    .sub {
      color: var(--mut)
    }

    body.w {
      background: var(--card)
    }

    .prize {
      text-align: center
    }

    .prize .medal {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 8px
    }

    .tip {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      border: 2px solid var(--line);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 12px;
      background: var(--card)
    }

    .tip .ti {
      font-size: 2rem
    }

    .tip h3 {
      margin-bottom: 4px
    }

    .tip p {
      margin: 0
    }

    .why {
      background: var(--i4);
      border-radius: 28px 28px 28px 8px;
      padding: 20px;
      margin: 18px 0
    }

    .lock {
      opacity: .8
    }

    .horta {
      font-size: 1.8rem;
      letter-spacing: 6px;
      margin-bottom: 6px
    }

    .scene {
      font-size: 4rem;
      text-align: center;
      background: var(--i3);
      border-radius: 28px;
      padding: 22px 10px;
      margin: 12px 0;
      min-height: 130px;
      line-height: 1.2
    }

    .scene small {
      display: block;
      font-size: 1.05rem;
      margin-top: 8px;
      font-weight: 700
    }

    .linkbtn {
      background: none;
      border: 0;
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 6px;
      min-height: 44px;
      text-decoration: underline
    }

    .tapbox {
      position: relative;
      height: 190px;
      background: var(--i3);
      border-radius: 28px;
      margin: 12px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .spout {
      margin-top: 14px;
      width: 90px;
      height: 26px;
      border-radius: 14px 14px 4px 4px;
      background: #8aa0ad
    }

    .stream {
      width: 30px;
      height: 120px;
      background: repeating-linear-gradient(180deg, #5ec3ee 0 12px, #9adcf6 12px 24px)
    }

    .pool {
      position: absolute;
      bottom: 0;
      height: 16px;
      border-radius: 50%;
      background: #5ec3ee;
      opacity: .7;
      width: 40px;
      left: 50%;
      transform: translateX(-50%)
    }

    .knobwrap {
      display: flex;
      justify-content: center;
      margin: 14px 0
    }

    .knob {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #bfe9ff, #5ec3ee);
      border: 8px solid #3a9fd0;
      position: relative;
      touch-action: none;
      cursor: grab
    }

    .knob::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 10px;
      width: 12px;
      height: 52px;
      margin-left: -6px;
      border-radius: 8px;
      background: #fff
    }

    .chip {
      display: inline-block;
      background: var(--i4);
      border-radius: 99px;
      padding: 6px 16px;
      font-weight: 700
    }

    .field {
      position: relative;
      height: 340px;
      border-radius: 28px;
      overflow: hidden;
      margin-top: 10px;
      touch-action: manipulation
    }

    .field.rio {
      background: linear-gradient(180deg, #bfe9ff, #7fd0f0 50%, #5ec3ee)
    }

    .field.rio::before,
    .field.rio::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 34px;
      background: #9bdc5a
    }

    .field.rio::before {
      top: 0
    }

    .field.rio::after {
      bottom: 0
    }

    .field.rua {
      background: repeating-linear-gradient(180deg, transparent 0 40px, rgba(255, 255, 255, .8) 40px 70px) 50%/8px 100% no-repeat, #c9ced3
    }

    .it {
      position: absolute;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .6);
      font-size: 2rem;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      display: grid;
      place-items: center
    }

    @media (prefers-reduced-motion:no-preference) {
      .stream {
        animation: flow .35s linear infinite
      }

      @keyframes flow {
        to {
          background-position: 0 24px
        }
      }
    }

    @media (prefers-reduced-motion:no-preference) {
      .face {
        animation: bob 3s ease-in-out infinite
      }

      @keyframes bob {
        50% {
          transform: translateY(-5px)
        }
      }
    }

    @media (min-width:600px) {
      .stop {
        width: 62%
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#inicio"><span aria-hidden="true">🌍</span>Missão Planeta</a>
    <div class="ages" id="ages" role="group" aria-label="Faixa etária"></div>
  </header>
  <main id="app"></main>
  <script>
    (function () {
      var KEY = "missao-planeta-mapa-v1";
      var S = {age: "a", visited: {}, trail: false, quiz: null, ch: [false, false, false]};
      try {var r = localStorage.getItem(KEY); if (r) {S = Object.assign(S, JSON.parse(r));} } catch (e) { }
      var save = function () {try {localStorage.setItem(KEY, JSON.stringify(S));} catch (e) { } };
      var $ = function (s) {return document.querySelector(s);};

      var E = {
        "ilha-respeito": {
          i: "🤝", n: "Ilha do Respeito", t: "Ética e cidadania", next: ["ilha-natureza", "Seguir para a Ilha da Natureza"],
          a: ["Ouvir quem fala com a gente é um jeito de dizer “eu me importo”.", "Cada pessoa é diferente, e isso deixa o mundo mais legal.", "Cuidar da sala, da escola e da rua é cuidar de todo mundo."],
          b: ["Empatia é tentar entender o que o outro sente, mesmo quando pensamos diferente.", "A diversidade de ideias, culturas e jeitos de ser enriquece a convivência.", "Nossas atitudes no grupo, na escola e nas redes afetam outras pessoas: isso é responsabilidade coletiva."]
        },
        "ilha-consumo": {
          i: "♻️", n: "Ilha do Consumo Consciente", t: "Sustentabilidade", next: ["praia-desafios", "Seguir para a Praia dos Desafios"],
          a: ["Antes de jogar fora, pense: dá para usar de novo?", "Papel, plástico, vidro e metal podem ser separados para reciclar.", "Comprar só o que a gente precisa evita muito lixo."],
          b: ["Consumo consciente é perguntar: eu preciso disso? De onde vem? Para onde vai depois?", "Reduzir, reutilizar e reciclar: nessa ordem, o melhor lixo é o que nem chega a existir.", "Pequenas escolhas repetidas por muita gente geram um grande impacto."]
        }
      };
      var LES = {
        a: ["A Tuti cuida da horta da escola e hoje precisa da sua ajuda! Toda planta, bicho e pessoa precisa de água para viver.", "A água limpa é um tesouro e pode ficar escassa se a gente desperdiçar. Por isso, cada gota conta.", "Em casa e na escola você pode ajudar: fechar a torneira, tomar banhos mais curtos e avisar um adulto sobre vazamentos. Agora é a sua vez de decidir pelo destino da horta!"],
        b: ["A horta da escola está em perigo e a Tuti conta com você. A água circula pelo planeta, mas a água doce disponível é limitada e depende de rios, nascentes e chuvas.", "Desperdício, poluição e desmatamento ameaçam as fontes de água e a vida que depende delas, inclusive a nossa horta.", "Hábitos simples somam: fechar torneiras, reaproveitar água, tomar banhos curtos e cobrar conserto de vazamentos. Agora suas decisões vão mudar o destino da horta!"]
      };
      var QZ = [
        {q: "A torneira do pátio está pingando e ninguém percebeu. O que você faz?", o: ["Finjo que não vi", "Aviso um adulto responsável", "Abro mais para lavar o pátio", "Espero alguém reclamar"], c: 1, f: "O zelador consertou a torneira e a água economizada foi usada para regar a horta.", w: ["A torneira continuou pingando o dia todo, a poça cresceu e a água da horta acabou. As plantinhas começaram a murchar.", "", "A água jorrou à toa e escorreu pelo ralo. Sem água para regar, as mudinhas ficaram com muita sede.", "Todo mundo achou que outra pessoa ia avisar, e o vazamento seguiu. A horta passou o dia sem água."]},
        {q: "É hora de escovar os dentes antes do recreio. O que ajuda a economizar água?", o: ["Deixar a torneira aberta o tempo todo", "Fechar a torneira enquanto escova", "Usar água em dobro para enxaguar", "Nem pensar em economizar"], c: 1, f: "A água que sobrou foi para a horta, e as plantas ficaram bem viçosas.", w: ["Você deixou a torneira aberta e a água correu sem parar. O reservatório esvaziou, as plantas torraram com o sol e murcharam.", "", "Com tanta água gasta, a caixa d’água ficou quase vazia e a horta não foi regada.", "A água acabou antes do fim do dia e a horta ficou seca. As folhas começaram a cair."]},
        {q: "Como regar a horta gastando pouca água?", o: ["Com a mangueira ligada por uma hora", "Com um regador, de manhã cedo ou no fim da tarde", "Ao meio-dia, com o sol a pino", "Não regar e esperar a chuva"], c: 1, f: "Com menos sol, a água evapora menos e as plantas aproveitam melhor cada gota.", w: ["A mangueira encharcou a terra e a água escorreu pelo chão, faltando para o resto da escola. As raízes ficaram alagadas.", "", "Com o sol forte, a água evaporou rápido e as plantas continuaram com sede.", "Não choveu naquela semana e a horta secou. As flores murcharam."]}
      ];
      var CH = [
        {i: "💧", n: "Guardião da água", d: "Feche a torneira ao escovar os dentes e conte a alguém por que isso importa."},
        {i: "♻️", n: "Separação consciente", d: "Separe os resíduos de casa e descubra o que pode ser reciclado."},
        {i: "💛", n: "Gesto de respeito", d: "Faça um elogio sincero ou ajude alguém sem esperar nada em troca."}
      ];
      var step = 0, qi = 0, sc = 0, ans = null, wrong = null, first = true, pm = "menu", ps = 0, gd = 0, tp = {s: 0, rot: 0, t0: 0, res: null}, cm = "menu", cl = {s: 0};

      function prog() {return (S.trail ? 1 : 0) + (S.quiz != null ? 1 : 0) + S.ch.filter(Boolean).length;}
      function level(n) {return n < 1 ? "Explorador" : n < 3 ? "Aprendiz verde" : n < 5 ? "Guardião" : "Guardião do Planeta";}
      function msg(n) {return n === 0 ? "Oi! Eu sou a Tuti. Vamos explorar as ilhas juntos?" : n < 3 ? "Boa! Continue pelo mapa, cada etapa conta." : n < 5 ? "Falta pouco para virar Guardião do Planeta!" : "Missão cumprida! Seu prêmio está esperando no fim do mapa.";}
      function bar(n) {return '<div class="bar" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="5" aria-valuenow="' + n + '"><i style="width:' + (n * 20) + '%"></i></div>';}
      function tuti(m) {return '<div class="tuti"><span class="face" aria-hidden="true">🐢</span><p>' + m + '</p></div>';}

      var V = {
        inicio: function () {return '<section class="hero"><h1>Uma ilha de cada vez, a gente cuida do mundo.</h1><p>Explore o mapa com a Tuti, aprenda sobre ética, natureza e consumo consciente e complete missões do dia a dia.</p><div class="row"><a class="btn" href="#mapa">Começar a jornada</a><a class="btn ghost" href="#sobre">Conhecer o projeto</a></div><div class="globe" aria-hidden="true">🌱</div></section>' + tuti("Escolha sua faixa etária lá em cima e siga o mapa. Seu progresso fica guardado neste aparelho.");},
        mapa: function () {
          var n = prog(), c = S.ch.filter(Boolean).length;
          var st = [["ilha-respeito", "🤝", "Ilha do Respeito", "Ética e cidadania", S.visited["ilha-respeito"] ? "Visitada ✓" : "Explorar"],

        return back + '<section class="card prize"><div class="medal" aria-hidden="true">' + (rio ? "🌊" : "🛣️") + '</div><h2>' + (pct >= 70 ? "Mestre da limpeza!" : pct >= 40 ? "Bom trabalho!" : "Cada item conta!") + '</h2><p class="lesson">Dos <b>' + r.total + '</b> itens de lixo que passaram, você ajudou a retirar <b>' + r.got + '</b> (' + pct + '%).</p>' + (r.hit ? '<p class="sub">Você tocou em bichos ' + r.hit + ' vez(es). Cuidado com eles!</p>' : "") + '</section><div class="why"><h3>Como isso ajuda</h3><p>' + why + '</p><p style="margin:0">' + tip + '</p></div><div class="row"><button class="btn" data-act="cagain">Jogar de novo</button><button class="btn ghost" data-act="cm" data-v="menu">Voltar ao mutirão</button></div>';
      }
      function cInit() {
        var fd = $("#fd"), tt = $("#cg-t"), nn = $("#cg-n");
        if (!fd || cl.s !== 1) return;
        var rio = cm === "rio", W = fd.clientWidth, H = fd.clientHeight, items = [], last = performance.now(), acc = 0.6;
        var TR = rio ? ["🥤", "🛍️", "🥫", "👟", "📦", "🍾"] : ["🥤", "🛍️", "📰", "🥫", "🧃", "📦"];
        var AN = rio ? ["🐟", "🦦"] : ["🐈", "🐦"];
        function spawn() {
          var an = Math.random() < 0.18, L = an ? AN : TR, b = document.createElement("button");
          b.type = "button"; b.className = "it"; b.textContent = L[Math.floor(Math.random() * L.length)];
          b.setAttribute("aria-label", an ? "Bicho, não toque" : "Lixo, toque para recolher");
          var o = rio ? 44 + Math.random() * (H - 44 * 2 - 56) : 10 + Math.random() * (W - 76);
          var it = {el: b, p: -60, v: 60 + Math.random() * 40};
          if (rio) {b.style.top = o + "px"; b.style.left = "-60px";} else {b.style.left = o + "px"; b.style.top = "-60px";}
          if (!an) cl.total++;
          b.addEventListener("pointerdown", function (e) {e.preventDefault(); if (!b.isConnected || cl.s !== 1) return; b.remove(); if (an) {cl.hit++; cl.got = Math.max(0, cl.got - 1);} else {cl.got++;} nn.textContent = cl.got;});
          fd.appendChild(b); items.push(it);
        }
        (function tick(now) {
          if (cl.s !== 1 || !document.body.contains(fd)) return;
          var dt = (now - last) / 1000; last = now; acc += dt;
          var el = (now - cl.t0) / 1000;
          if (el >= 30) {cl.res = {got: cl.got, total: cl.total, hit: cl.hit}; cl.s = 2; var k = rio ? "rio" : "rua"; S[k] = S[k] == null ? cl.got : Math.max(S[k], cl.got); save(); render(); return;}
          if (acc > 0.65) {acc = 0; spawn();}
          items = items.filter(function (it) {
            if (!it.el.isConnected) return false;
            it.p += it.v * dt;
            if (it.p > (rio ? W : H)) {it.el.remove(); return false;}
            if (rio) it.el.style.left = it.p + "px"; else it.el.style.top = it.p + "px";
            return true;
          });
          tt.textContent = Math.ceil(30 - el);
          requestAnimationFrame(tick);
        })(performance.now());
      }
      function ilha(k) {
        S.visited[k] = 1; save(); var e = E[k];
        return '<a class="back" href="#mapa">Voltar ao mapa</a><section class="card"><div class="big-ico" aria-hidden="true">' + e.i + '</div><p class="sub">' + e.t + '</p><h2>' + e.n + '</h2><ul class="pts">' + e[S.age].map(function (x) {return "<li>" + x + "</li>";}).join("") + '</ul></section><a class="btn" href="#' + e.next[0] + '">' + e.next[1] + '</a>';
      }
      function head() {
        $("#ages").innerHTML = [["a", "8 a 11 anos"], ["b", "12 a 16 anos"]].map(function (x) {return '<button data-act="age" data-v="' + x[0] + '" aria-pressed="' + (S.age === x[0]) + '">' + x[1] + '</button>';}).join("");
      }
      function render() {
        var k = location.hash.slice(1); if (!V[k]) k = "inicio";
        $("#app").innerHTML = V[k](); document.body.className = (k === "inicio" || k === "mapa") ? "" : "w"; head(); if (k === "premio" && prog() >= 5) confetti(); if (k === "ilha-pratica" && pm === "tap") tapInit(); if (k === "ilha-limpeza" && cm !== "menu" && cl.s === 1) cInit();
      }
      function confetti() {
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var old = document.getElementById("cf"); if (old) old.remove();
        var c = document.createElement("canvas"); c.id = "cf"; c.setAttribute("aria-hidden", "true");
        c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
        document.body.appendChild(c);
        var w = c.width = window.innerWidth, h = c.height = window.innerHeight, g = c.getContext("2d");
        var cols = ["#2f8f45", "#9bdc5a", "#5ec3ee", "#a8defa", "#ffd23f", "#ffe27a"], P = [];
        for (var i = 0; i < 150; i++)P.push({x: Math.random() * w, y: -20 - Math.random() * h * 0.6, s: 6 + Math.random() * 7, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3.5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length]});
        var t0 = performance.now();
        (function f(t) {
          g.clearRect(0, 0, w, h);
          P.forEach(function (p) {p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6); g.restore();});
          if (t - t0 < 4500) requestAnimationFrame(f); else c.remove();
        })(t0);
      }
      function top() {window.scrollTo(0, 0);}
      document.addEventListener("click", function (ev) {
        var b = ev.target.closest("[data-act]"); if (!b) return;
        var a = b.dataset.act, i = +b.dataset.i;
        if (a === "age") {S.age = b.dataset.v; save(); render();}
        else if (a === "ch") {S.ch[i] = !S.ch[i]; save(); render();}
        else if (a === "prev") {step--; render(); top();}
        else if (a === "next") {step++; if (step === 3) {S.trail = true; save(); qi = 0; sc = 0; ans = null; wrong = null; first = true;} render(); top();}
        else if (a === "ans" && ans === null && wrong === null) {if (i === QZ[qi].c) {ans = i; if (first) sc++;} else {wrong = i; first = false;} render();}
        else if (a === "retry") {wrong = null; render();}
        else if (a === "qnext") {qi++; ans = null; wrong = null; first = true; if (qi >= QZ.length) {S.quiz = Math.max(S.quiz == null ? 0 : S.quiz, sc); save(); step = 4;} render(); top();}
        else if (a === "redo") {step = 3; qi = 0; sc = 0; ans = null; wrong = null; first = true; render(); top();}
        else if (a === "conf") {confetti();}
        else if (a === "pm") {pm = b.dataset.v; ps = 0; gd = 0; tp = {s: 0, rot: 0, t0: 0, res: null}; render(); top();}
        else if (a === "pstep") {ps++; render();}
        else if (a === "pdays") {gd++; if (gd >= 4) {if (pm === "tree") S.tree = true; else S.plant = true; save(); confetti();} render();}
        else if (a === "tapstart") {tp = {s: 1, rot: 0, t0: performance.now(), res: null}; render();}
        else if (a === "tapagain") {tp = {s: 0, rot: 0, t0: 0, res: null}; render();}
        else if (a === "cm") {cm = b.dataset.v; cl = {s: 0}; render(); top();}
        else if (a === "cstart") {cl = {s: 1, t0: performance.now(), got: 0, total: 0, hit: 0, res: null}; render();}
        else if (a === "cagain") {cl = {s: 0}; render();}
        else if (a === "reset") {S = {age: S.age, visited: {}, trail: false, quiz: null, ch: [false, false, false], plant: false, tap: null, tree: false, rio: null, rua: null}; save(); render();}
      });
      window.addEventListener("hashchange", function () {step = 0; qi = 0; sc = 0; ans = null; wrong = null; first = true; pm = "menu"; ps = 0; gd = 0; tp = {s: 0, rot: 0, t0: 0, res: null}; cm = "menu"; cl = {s: 0}; render(); top();});
      render();
    })();
  </script>
